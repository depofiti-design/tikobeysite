<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Panel</title>
<link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--acc:#ff6b00;--acc2:#ff9500;--ag:rgba(255,107,0,0.13);--ab:rgba(255,107,0,0.28);--bg:#080d14;--bg2:#0d1520;--bg3:#111c2a;--card:#0f1a28;--brd:rgba(255,255,255,0.07);--brd2:rgba(255,255,255,0.13);--tx:#e8edf5;--tx2:#8a9ab5;--tx3:#4a5a70;}
*{box-sizing:border-box;margin:0;padding:0;}
body{font-family:'Barlow',sans-serif;background:var(--bg);color:var(--tx);min-height:100vh;display:flex;flex-direction:column;}
body::before{content:'';position:fixed;inset:0;background:radial-gradient(ellipse 60% 50% at 15% 20%,rgba(255,107,0,0.06) 0%,transparent 70%);pointer-events:none;z-index:0;}
.login-wrap{position:fixed;inset:0;z-index:100;display:flex;align-items:center;justify-content:center;padding:20px;background:var(--bg);}
.login-box{background:var(--bg2);border:1px solid var(--ab);border-radius:16px;padding:36px 32px;max-width:380px;width:100%;text-align:center;}
.login-logo{font-family:'Rajdhani',sans-serif;font-size:32px;font-weight:700;margin-bottom:6px;}
.login-logo span{color:var(--acc);}
.login-sub{color:var(--tx3);font-size:13px;margin-bottom:28px;}
.login-input{width:100%;background:var(--bg3);border:1px solid var(--brd);border-radius:10px;padding:13px 16px;color:var(--tx);font-size:15px;font-family:'Barlow',sans-serif;outline:none;transition:border-color .2s;text-align:center;letter-spacing:2px;margin-bottom:14px;}
.login-input:focus{border-color:var(--ab);}
.login-input::placeholder{letter-spacing:0;color:var(--tx3);}
.login-btn{width:100%;background:var(--acc);color:#fff;font-family:'Rajdhani',sans-serif;font-size:16px;font-weight:700;padding:13px;border-radius:10px;border:none;cursor:pointer;transition:all .2s;letter-spacing:.5px;}
.login-btn:hover{background:var(--acc2);}
.login-err{color:#ff5252;font-size:13px;margin-top:10px;min-height:18px;}
header{position:sticky;top:0;z-index:50;background:rgba(8,13,20,0.95);backdrop-filter:blur(20px);border-bottom:1px solid var(--brd);height:60px;display:flex;align-items:center;padding:0 24px;justify-content:space-between;}
.h-logo{font-family:'Rajdhani',sans-serif;font-size:22px;font-weight:700;}
.h-logo span{color:var(--acc);}
.h-badge{font-size:11px;background:var(--ag);color:var(--acc);border:1px solid var(--ab);border-radius:20px;padding:3px 10px;margin-left:8px;}
.h-right{display:flex;align-items:center;gap:10px;}
.h-save{background:var(--acc);color:#fff;font-family:'Rajdhani',sans-serif;font-size:14px;font-weight:700;padding:8px 20px;border-radius:8px;border:none;cursor:pointer;transition:all .2s;}
.h-save:hover{background:var(--acc2);}
.h-logout{background:var(--bg3);color:var(--tx2);font-size:13px;padding:7px 14px;border-radius:8px;border:1px solid var(--brd);cursor:pointer;font-family:'Barlow',sans-serif;}
main{position:relative;z-index:1;max-width:800px;margin:0 auto;width:100%;padding:24px 20px 60px;}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:28px;}
.stat-card{background:var(--bg2);border:1px solid var(--brd);border-radius:12px;padding:16px;text-align:center;}
.stat-num{font-family:'Rajdhani',sans-serif;font-size:28px;font-weight:700;color:var(--acc);}
.stat-lbl{font-size:12px;color:var(--tx3);margin-top:2px;}
.sec-title{font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:600;letter-spacing:2px;text-transform:uppercase;color:var(--tx3);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between;}
.add-btn{font-family:'Rajdhani',sans-serif;font-size:12px;font-weight:600;background:var(--ag);color:var(--acc);border:1px solid var(--ab);border-radius:7px;padding:5px 14px;cursor:pointer;transition:all .2s;}
.add-btn:hover{background:var(--acc);color:#fff;}
.sponsor-list{display:flex;flex-direction:column;gap:10px;margin-bottom:32px;}
.srow{background:var(--bg2);border:1px solid var(--brd);border-radius:12px;overflow:hidden;}
.srow-head{display:flex;align-items:center;gap:12px;padding:13px 16px;cursor:pointer;}
.srow-preview{font-family:'Rajdhani',sans-serif;font-size:16px;font-weight:700;flex:1;}
.srow-tag{font-size:10px;font-weight:600;padding:2px 7px;border-radius:4px;}
.t-hot{background:rgba(255,23,68,0.12);color:#ff5252;border:1px solid rgba(255,23,68,0.2);}
.t-new{background:rgba(0,230,118,0.1);color:#00e676;border:1px solid rgba(0,230,118,0.18);}
.t-tr{background:rgba(41,121,255,0.1);color:#5c9eff;border:1px solid rgba(41,121,255,0.18);}
.t-vip{background:rgba(170,0,255,0.1);color:#cc66ff;border:1px solid rgba(170,0,255,0.18);}
.t-gl{background:rgba(245,166,35,0.1);color:#f5a623;border:1px solid rgba(245,166,35,0.18);}
.srow-toggle{color:var(--tx3);font-size:13px;transition:transform .2s;}
.srow-toggle.open{transform:rotate(180deg);}
.srow-del{background:rgba(255,23,68,0.1);color:#ff5252;border:1px solid rgba(255,23,68,0.15);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer;}
.srow-body{display:none;padding:0 16px 16px;border-top:1px solid var(--brd);}
.srow-body.open{display:block;}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.field{display:flex;flex-direction:column;gap:4px;}
.field label{font-size:11px;color:var(--tx3);font-weight:500;letter-spacing:.5px;text-transform:uppercase;}
.field input,.field select{background:var(--bg3);border:1px solid var(--brd);border-radius:7px;padding:9px 11px;color:var(--tx);font-size:13px;font-family:'Barlow',sans-serif;outline:none;width:100%;}
.field.full{grid-column:1/-1;}
.color-row{grid-column:1/-1;display:flex;gap:16px;}
.cpick{display:flex;flex-direction:column;gap:4px;}
.cpick label{font-size:11px;color:var(--tx3);font-weight:500;text-transform:uppercase;}
.cpick input[type=color]{width:52px;height:34px;border:1px solid var(--brd);border-radius:7px;padding:2px;background:var(--bg2);cursor:pointer;}
.feat-box{background:var(--bg2);border:1px solid var(--ab);border-radius:12px;padding:20px;margin-bottom:28px;}
.feat-fields{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-top:14px;}
.banner-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:32px;}
.banner-card{background:var(--bg2);border:1px solid var(--brd);border-radius:12px;padding:16px;}
.banner-card-title{font-family:'Rajdhani',sans-serif;font-size:13px;font-weight:600;color:var(--acc);letter-spacing:1px;text-transform:uppercase;margin-bottom:12px;}
.banner-preview{width:100%;height:60px;object-fit:cover;border-radius:7px;margin-bottom:10px;display:block;}
.banner-empty{width:100%;height:60px;background:var(--bg3);border-radius:7px;margin-bottom:10px;display:flex;align-items:center;justify-content:center;color:var(--tx3);font-size:12px;}
.settings-grid{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin-bottom:32px;}
.toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:var(--acc);color:#fff;font-family:'Rajdhani',sans-serif;font-size:15px;font-weight:600;padding:12px 28px;border-radius:10px;z-index:999;transition:transform .3s;pointer-events:none;}
.toast.show{transform:translateX(-50%) translateY(0);}
@media(max-width:600px){.stats{grid-template-columns:1fr 1fr;}.fields,.feat-fields,.settings-grid,.banner-grid{grid-template-columns:1fr;}}
</style>
</head>
<body>

<div class="login-wrap" id="loginWrap">
  <div class="login-box">
    <div class="login-logo">TIKO<span>BEY</span></div>
    <div class="login-sub">Yönetici Girişi</div>
    <input class="login-input" type="password" id="pwInput" placeholder="Şifrenizi girin">
    <button class="login-btn" onclick="doLogin()">Giriş Yap</button>
    <div class="login-err" id="loginErr"></div>
  </div>
</div>

<header id="mainHeader" style="display:none;">
  <div style="display:flex;align-items:center;">
    <div class="h-logo">TIKO<span>BEY</span></div>
    <span class="h-badge">YÖNETİCİ</span>
  </div>
  <div class="h-right">
    <button class="h-save" onclick="saveAll()">💾 Kaydet & Yayınla</button>
    <button class="h-logout" onclick="doLogout()">Çıkış</button>
  </div>
</header>

<main id="mainContent" style="display:none;">
  <div class="stats">
    <div class="stat-card"><div class="stat-num" id="statTotal">0</div><div class="stat-lbl">Toplam Sponsor</div></div>
    <div class="stat-card"><div class="stat-num" id="statTR">0</div><div class="stat-lbl">Türkiye</div></div>
    <div class="stat-card"><div class="stat-num" id="statGlobal">0</div><div class="stat-lbl">Global</div></div>
  </div>

  <div class="sec-title">Öne Çıkan Sponsor</div>
  <div class="feat-box">
    <div class="feat-fields">
      <div class="field"><label>Logo 1. Kısım</label><input type="text" id="f-logo" placeholder="BET"></div>
      <div class="field"><label>Logo 2. Kısım</label><input type="text" id="f-logo2" placeholder="TURKEY"></div>
      <div class="field"><label>Başlık</label><input type="text" id="f-title"></div>
      <div class="field"><label>Açıklama</label><input type="text" id="f-desc"></div>
      <div class="field"><label>Link</label><input type="text" id="f-link" placeholder="https://..."></div>
      <div class="field"><label>Bonus 1</label><input type="text" id="f-b1" placeholder="%100"></div>
      <div class="field"><label>Bonus 1 Etiket</label><input type="text" id="f-b1l" placeholder="İlk Yatırım"></div>
      <div class="field"><label>Bonus 2</label><input type="text" id="f-b2" placeholder="1000₺"></div>
      <div class="field"><label>Bonus 2 Etiket</label><input type="text" id="f-b2l" placeholder="Deneme B."></div>
      <div class="field"><label>Bonus 3</label><input type="text" id="f-b3" placeholder="%35"></div>
      <div class="field"><label>Bonus 3 Etiket</label><input type="text" id="f-b3l" placeholder="Crypto B."></div>
    </div>
  </div>

  <div class="sec-title">Sponsorlar <button class="add-btn" onclick="addSponsor()">+ Yeni Ekle</button></div>
  <div class="sponsor-list" id="sponsorList"></div>

  <div class="sec-title">Banner Yönetimi</div>
  <div class="banner-grid" id="bannerGrid"></div>

  <div class="sec-title">Site Ayarları</div>
  <div class="settings-grid" id="settingsGrid"></div>
</main>

<div class="toast" id="toast">✓ Kaydedildi!</div>

<script>
const SUPA_URL = "https://rfuwnjsyulpmdyespacd.supabase.co";
const SUPA_KEY = "sb_publishable_BeRLk3mCeFsA2MqHPKQ0CA_CvbzLdyd";
const PASS = "tikobey2025";

function sbH() {
  return {"apikey":SUPA_KEY,"Authorization":"Bearer "+SUPA_KEY,"Content-Type":"application/json","Prefer":"return=representation"};
}

// AUTH
let attempts = 0;
function doLogin() {
  const pw = document.getElementById('pwInput').value;
  if(pw === PASS) {
    document.getElementById('loginWrap').style.display = 'none';
    document.getElementById('mainHeader').style.display = 'flex';
    document.getElementById('mainContent').style.display = 'block';
    initPanel();
  } else {
    attempts++;
    document.getElementById('pwInput').value = '';
    document.getElementById('loginErr').textContent = 'Hatalı şifre! (' + (5-attempts) + ' hak kaldı)';
    if(attempts >= 5) { document.getElementById('loginErr').textContent = 'Çok fazla hatalı giriş!'; }
  }
}
function doLogout() {
  document.getElementById('mainHeader').style.display = 'none';
  document.getElementById('mainContent').style.display = 'none';
  document.getElementById('loginWrap').style.display = 'flex';
  document.getElementById('pwInput').value = '';
  document.getElementById('loginErr').textContent = '';
}
document.addEventListener('keydown', e => { if(e.key==='Enter') doLogin(); });

// DATA
const tagOpts = [
  {v:'hot',l:'HOT',c:'t-hot'},{v:'new',l:'YENİ',c:'t-new'},
  {v:'tr',l:'TR',c:'t-tr'},{v:'vip',l:'VIP',c:'t-vip'},{v:'global',l:'GLOBAL',c:'t-gl'}
];
let sponsors = [], featured = {}, banners = [], siteSettings = {};

async function initPanel() {
  await Promise.all([loadSponsors(), loadFeatured(), loadBanners(), loadSiteSettings()]);
  buildSponsorList();
  updateStats();
  buildBannerGrid();
  buildSettingsGrid();
}

async function loadSponsors() {
  try {
    const r = await fetch(SUPA_URL+"/rest/v1/sponsors?order=sort_order.asc",{headers:sbH()});
    sponsors = await r.json() || [];
  } catch(e) { sponsors = []; }
}

async function loadFeatured() {
  try {
    const r = await fetch(SUPA_URL+"/rest/v1/featured?limit=1",{headers:sbH()});
    const d = await r.json();
    featured = (d && d.length) ? d[0] : {};
    ['logo','logo2','title','link','b1','b1l','b2','b2l','b3','b3l'].forEach(k=>{
      const el=document.getElementById('f-'+k); if(el) el.value=featured[k]||'';
    });
    const desc=document.getElementById('f-desc'); if(desc) desc.value=featured.description||'';
  } catch(e) {}
}

async function loadBanners() {
  try {
    const r = await fetch(SUPA_URL+"/rest/v1/banners?order=slot.asc",{headers:sbH()});
    banners = await r.json() || [];
  } catch(e) { banners = []; }
}

async function loadSiteSettings() {
  try {
    const r = await fetch(SUPA_URL+"/rest/v1/settings",{headers:sbH()});
    const d = await r.json() || [];
    d.forEach(s => { siteSettings[s.key] = s.value; });
  } catch(e) {}
}

// SPONSOR LIST
function buildSponsorList() {
  const list = document.getElementById('sponsorList');
  list.innerHTML = '';
  sponsors.forEach((s,i) => list.appendChild(makeRow(s,i)));
}
function makeRow(s,i) {
  const div = document.createElement('div');
  div.className = 'srow'; div.dataset.idx = i;
  const tagSel = tagOpts.map(t=>`<option value="${t.v}|${t.l}|${t.c}" ${s.tag===t.v?'selected':''}>${t.l}</option>`).join('');
  div.innerHTML = `
    <div class="srow-head" onclick="toggleRow(${i})">
      <span class="srow-preview" id="rp-${i}" style="color:${s.c1||'#ff6b00'}">${s.name1||''}<span style="color:${s.c2||'#fff'}">${s.name2||''}</span></span>
      <span class="srow-tag ${s.tag_class||s.tagClass||'t-new'}">${s.tag_label||s.tagLabel||'YENİ'}</span>
      <button class="srow-del" onclick="event.stopPropagation();delSponsor(${i})">Sil</button>
      <span class="srow-toggle" id="rt-${i}">▼</span>
    </div>
    <div class="srow-body" id="rb-${i}">
      <div class="fields">
        <div class="field"><label>İsim 1</label><input class="fn1" type="text" value="${s.name1||''}" oninput="previewRow(${i})"></div>
        <div class="field"><label>İsim 2</label><input class="fn2" type="text" value="${s.name2||''}" oninput="previewRow(${i})"></div>
        <div class="color-row">
          <div class="cpick"><label>Renk 1</label><input class="fc1" type="color" value="${s.c1||'#ff6b00'}" oninput="previewRow(${i})"></div>
          <div class="cpick"><label>Renk 2</label><input class="fc2" type="color" value="${s.c2||'#ffffff'}" oninput="previewRow(${i})"></div>
        </div>
        <div class="field"><label>Etiket</label><select class="ftag">${tagSel}</select></div>
        <div class="field full"><label>Bonus Metni</label><input class="fbon" type="text" value="${s.bonus||''}"></div>
        <div class="field full"><label>Link</label><input class="flnk" type="text" value="${s.link||'#'}" placeholder="https://..."></div>
        <div class="field full"><label>Kategori</label><input class="fcat" type="text" value="${s.cat||'global'}" placeholder="tr casino global spor crypto"></div>
      </div>
    </div>`;
  return div;
}
function toggleRow(i) {
  document.getElementById('rb-'+i).classList.toggle('open');
  document.getElementById('rt-'+i).classList.toggle('open');
}
function previewRow(i) {
  const g = document.querySelector('[data-idx="'+i+'"]');
  if(!g) return;
  const n1=g.querySelector('.fn1').value, n2=g.querySelector('.fn2').value;
  const c1=g.querySelector('.fc1').value, c2=g.querySelector('.fc2').value;
  const p=document.getElementById('rp-'+i);
  if(p) p.innerHTML=`<span style="color:${c1}">${n1}</span><span style="color:${c2}">${n2}</span>`;
}
function addSponsor() {
  sponsors.push({name1:"Yeni",name2:"Sponsor",c1:"#ff6b00",c2:"#ffffff",tag:"new",tag_label:"YENİ",tag_class:"t-new",tagLabel:"YENİ",tagClass:"t-new",bonus:"Bonus...",link:"#",cat:"global"});
  buildSponsorList(); updateStats();
  setTimeout(()=>{ const l=sponsors.length-1; toggleRow(l); document.querySelector('[data-idx="'+l+'"]').scrollIntoView({behavior:'smooth',block:'center'}); },100);
}
function delSponsor(i) {
  if(!confirm('"'+sponsors[i].name1+sponsors[i].name2+'" silinsin mi?')) return;
  sponsors.splice(i,1); buildSponsorList(); updateStats();
}
function updateStats() {
  document.getElementById('statTotal').textContent = sponsors.length;
  document.getElementById('statTR').textContent = sponsors.filter(s=>(s.cat||'').includes('tr')).length;
  document.getElementById('statGlobal').textContent = sponsors.filter(s=>(s.cat||'').includes('global')).length;
}

// BANNER GRID
function buildBannerGrid() {
  const g = document.getElementById('bannerGrid');
  if(!g) return;
  const slotNames = ['Üst Sol','Üst Sağ','Alt Sol (Masaüstü)','Alt Sağ (Masaüstü)'];
  g.innerHTML = '';
  banners.forEach((b,i) => {
    const div = document.createElement('div');
    div.className = 'banner-card';
    div.innerHTML = `
      <div class="banner-card-title">Banner ${b.slot} — ${slotNames[i]||''}</div>
      ${b.image_url ? `<img src="${b.image_url}" class="banner-preview">` : `<div class="banner-empty">Görsel yok</div>`}
      <div class="field" style="margin-bottom:8px;"><label>Görsel URL</label><input type="text" id="bn-img-${b.slot}" value="${b.image_url||''}" placeholder="https://..." style="background:var(--bg3);border:1px solid var(--brd);border-radius:7px;padding:8px 10px;color:var(--tx);font-size:12px;font-family:'Barlow',sans-serif;outline:none;width:100%;"></div>
      <div class="field"><label>Tıklanınca Git</label><input type="text" id="bn-lnk-${b.slot}" value="${b.link_url||''}" placeholder="https://..." style="background:var(--bg3);border:1px solid var(--brd);border-radius:7px;padding:8px 10px;color:var(--tx);font-size:12px;font-family:'Barlow',sans-serif;outline:none;width:100%;"></div>
      <label style="display:flex;align-items:center;gap:8px;font-size:12px;color:var(--tx2);margin-top:8px;cursor:pointer;"><input type="checkbox" id="bn-vis-${b.slot}" ${b.visible?'checked':''}> Görünür</label>`;
    g.appendChild(div);
  });
}

// SETTINGS GRID
function buildSettingsGrid() {
  const g = document.getElementById('settingsGrid');
  if(!g) return;
  const fields = [
    {key:'site_title', label:'Site Başlığı'},
    {key:'telegram_url', label:'Telegram URL'},
    {key:'duyuru_url', label:'Duyuru Kanalı URL'},
    {key:'marketing_url', label:'Marketing Telegram'},
    {key:'mail', label:'İş Birliği Mail'},
    {key:'youtube_url', label:'YouTube URL'},
    {key:'kick_url', label:'Kick URL'},
  ];
  g.innerHTML = fields.map(f => `
    <div class="field">
      <label>${f.label}</label>
      <input type="text" id="st-${f.key}" value="${siteSettings[f.key]||''}"
        style="background:var(--bg3);border:1px solid var(--brd);border-radius:7px;padding:9px 11px;color:var(--tx);font-size:13px;font-family:'Barlow',sans-serif;outline:none;width:100%;">
    </div>`).join('');
}

// SAVE ALL
async function saveAll() {
  showToast('⏳ Kaydediliyor...');
  try {
    // Save featured
    const fPayload = {
      logo: document.getElementById('f-logo').value,
      logo2: document.getElementById('f-logo2').value,
      title: document.getElementById('f-title').value,
      description: document.getElementById('f-desc').value,
      link: document.getElementById('f-link').value,
      b1: document.getElementById('f-b1').value, b1l: document.getElementById('f-b1l').value,
      b2: document.getElementById('f-b2').value, b2l: document.getElementById('f-b2l').value,
      b3: document.getElementById('f-b3').value, b3l: document.getElementById('f-b3l').value,
    };
    if(featured.id) {
      await fetch(SUPA_URL+"/rest/v1/featured?id=eq."+featured.id,{method:"PATCH",headers:sbH(),body:JSON.stringify(fPayload)});
    } else {
      const r = await fetch(SUPA_URL+"/rest/v1/featured",{method:"POST",headers:sbH(),body:JSON.stringify(fPayload)});
      const d = await r.json(); if(d&&d[0]) featured.id=d[0].id;
    }

    // Save sponsors
    await fetch(SUPA_URL+"/rest/v1/sponsors?id=gt.0",{method:"DELETE",headers:sbH()});
    const g = document.querySelectorAll('.srow');
    let sponsorFailCount = 0;
    for(let i=0;i<g.length;i++){
      const row=g[i];
      const tv=row.querySelector('.ftag').value.split('|');
      const sr = await fetch(SUPA_URL+"/rest/v1/sponsors",{method:"POST",headers:sbH(),body:JSON.stringify({
        name1:row.querySelector('.fn1').value, name2:row.querySelector('.fn2').value,
        c1:row.querySelector('.fc1').value, c2:row.querySelector('.fc2').value,
        tag:tv[0], tag_label:tv[1], tag_class:tv[2],
        bonus:row.querySelector('.fbon').value, link:row.querySelector('.flnk').value,
        cat:row.querySelector('.fcat').value, sort_order:i
      })});
      if(!sr.ok) sponsorFailCount++;
    }

    // Save banners
    for(const b of banners) {
      const img=document.getElementById('bn-img-'+b.slot);
      const lnk=document.getElementById('bn-lnk-'+b.slot);
      const vis=document.getElementById('bn-vis-'+b.slot);
      if(!img) continue;
      await fetch(SUPA_URL+"/rest/v1/banners?slot=eq."+b.slot,{method:"PATCH",headers:sbH(),body:JSON.stringify({
        image_url:img.value, link_url:lnk?lnk.value:'#', visible:vis?vis.checked:true
      })});
    }

    // Save settings
    const sKeys=['site_title','telegram_url','duyuru_url','marketing_url','mail','youtube_url','kick_url'];
    for(const key of sKeys) {
      const el=document.getElementById('st-'+key);
      if(!el) continue;
      await fetch(SUPA_URL+"/rest/v1/settings?key=eq."+key,{method:"PATCH",headers:sbH(),body:JSON.stringify({value:el.value})});
    }

    await loadSponsors(); buildSponsorList(); updateStats();
    if(sponsorFailCount > 0 || sponsors.length !== g.length) {
      showToast('⚠️ Eksik kaydedildi, kontrol et!');
      alert(g.length + ' sponsordan sadece ' + sponsors.length + ' tanesi kaydedildi. Sayfayı kapatmadan önce eksik olan(lar)ı tekrar ekleyip "Kaydet & Yayınla"ya tekrar bas.');
    } else {
      showToast('✓ Kaydedildi! Ana sitede yansıdı.');
    }
  } catch(e) {
    console.log("Save error:", e);
    showToast('❌ Hata oluştu!');
  }
}

function showToast(msg) {
  const t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
</script>
</body>
</html>
